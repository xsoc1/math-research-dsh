# DSH bundle profile patch.
# Makes the plugin installable AND active via:
#   dsh plugin --profile web add github:xsoc1/math-research-dsh
# `id`   = the Cordis plugin id (see `export const name` in index.mjs)
# `name` = the npm package name (resolved from node_modules after install)
- insert:
    - id: math-research-dsh
      name: 'math-research-dsh'
